[theme]
name = "catppuccin-mocha"

[colors]
Base       = "#cdd6f4"   # Text        — 主文字
Annotation = "#bac2de"   # Subtext1    — 时间/次要信息（比 Subtext0 亮）
Guidance   = "#89b4fa"   # Blue        — 引导/提示
Important  = "#a6e3a1"   # Green       — 成功/exit=0
AlertInfo  = "#94e2d5"   # Teal        — 信息
AlertWarn  = "#fab387"   # Peach       — 警告（橙色，与白色区分更明显）
AlertError = "#f38ba8"   # Red         — 错误/exit≠0
