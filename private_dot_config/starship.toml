format = """$directory$git_branch$git_status$git_state
$character"""

right_format = """$nodejs$golang$python$rust$cmd_duration"""

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only_style = "red"
home_symbol = "~"
fish_style_pwd_dir_length = 1

[git_branch]
style = "bold purple"
truncation_length = 30
symbol = "⎇ "

[git_status]
format = '([ \[$all_status$ahead_behind\]]($style))'
style = "bold yellow"
staged    = "[+${count}](green)"
modified  = "[!${count}](yellow)"
deleted   = "[✘${count}](red)"
renamed   = "[»${count}](blue)"
untracked = "[?${count}](white)"
stashed   = "[≡${count}](cyan)"
ahead     = " ⇡${count}"
behind    = " ⇣${count}"
diverged  = " ⇡${ahead_count}⇣${behind_count}"

[git_state]
style = "bold red"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_metrics]
disabled = true

[nodejs]
style = "bold green"
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[golang]
style = "bold cyan"
detect_files = ["go.mod", "go.sum", ".go-version"]

[cmd_duration]
format = "[⏱ $duration]($style) "
style = "bold yellow"
min_time = 500

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[time]
disabled = true

[python]
style = "bold yellow"
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]
detect_folders = [".venv", "venv"]

[rust]
style = "bold orange"
detect_files = ["Cargo.toml"]

[os]
disabled = false
style = "bold white"

[package]
disabled = true
